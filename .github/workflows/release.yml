```yaml
name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm --onefile --name ScraperMW ScraperMW.py

      - name: Rename executable
        shell: bash
        run: |
          if [ "${{ matrix.artifact }}" = "windows" ]; then
            mv dist/ScraperMW.exe dist/ScraperMW-windows.exe
          else
            mv dist/ScraperMW "dist/ScraperMW-${{ matrix.artifact }}"
          fi

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ScraperMW-${{ matrix.artifact }}
          path: dist/ScraperMW-${{ matrix.artifact }}*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: ScraperMW-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ScraperMW ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
```
